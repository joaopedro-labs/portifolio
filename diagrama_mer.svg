<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="headerBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="headerPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="headerGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="headerAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="960" height="540" rx="16" fill="url(#bgGrad)" stroke="#1f2937" stroke-width="2" />

  <!-- Título do Diagrama -->
  <text x="480" y="36" fill="#f3f4f6" font-size="18" font-weight="700" text-anchor="middle">
    Diagrama Entidade-Relacionamento (MER) — TecnoCapacita DB (MySQL)
  </text>

  <!-- Linhas de Relacionamento -->
  <!-- INSTRUTORES (1) -> (N) CURSOS -->
  <path d="M 270 155 L 360 155" stroke="#60a5fa" stroke-width="2.5" fill="none" />
  <circle cx="282" cy="155" r="4" fill="#60a5fa" />
  <path d="M 348 148 L 360 155 L 348 162" stroke="#60a5fa" stroke-width="2" fill="none" />
  <rect x="292" y="130" width="46" height="20" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
  <text x="315" y="144" fill="#93c5fd" font-size="11" font-weight="600" text-anchor="middle">1 : N</text>

  <!-- CURSOS (1) -> (N) MATRICULAS -->
  <path d="M 600 175 L 690 175" stroke="#a78bfa" stroke-width="2.5" fill="none" />
  <circle cx="612" cy="175" r="4" fill="#a78bfa" />
  <path d="M 678 168 L 690 175 L 678 182" stroke="#a78bfa" stroke-width="2" fill="none" />
  <rect x="622" y="150" width="46" height="20" rx="4" fill="#1e293b" stroke="#8b5cf6" stroke-width="1" />
  <text x="645" y="164" fill="#c4b5fd" font-size="11" font-weight="600" text-anchor="middle">1 : N</text>

  <!-- ALUNOS (1) -> (N) MATRICULAS -->
  <path d="M 600 405 L 810 405 L 810 295" stroke="#34d399" stroke-width="2.5" fill="none" />
  <circle cx="612" cy="405" r="4" fill="#34d399" />
  <path d="M 803 307 L 810 295 L 817 307" stroke="#34d399" stroke-width="2" fill="none" />
  <rect x="685" y="382" width="46" height="20" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="1" />
  <text x="708" y="396" fill="#6ee7b7" font-size="11" font-weight="600" text-anchor="middle">1 : N</text>

  <!-- Triggers Tracejado -> LOGS_AUDITORIA -->
  <path d="M 480 285 L 480 335 L 270 335 L 270 365" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="6,4" fill="none" />
  <path d="M 810 295 L 810 320 L 270 320" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="6,4" fill="none" />
  <text x="415" y="314" fill="#fbbf24" font-size="11" font-style="italic">Triggers gravam auditoria automática</text>

  <!-- ==================== TABELA 1: INSTRUTORES ==================== -->
  <g transform="translate(30, 70)" filter="url(#shadow)">
    <rect width="240" height="175" rx="10" fill="#161f33" stroke="#334155" stroke-width="1.5" />
    <path d="M 0 10 Q 0 0 10 0 L 230 0 Q 240 0 240 10 L 240 36 L 0 36 Z" fill="url(#headerBlue)" />
    <text x="120" y="23" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">INSTRUTORES</text>

    <text x="14" y="60" fill="#fbbf24" font-size="12" font-weight="700">PK</text>
    <text x="42" y="60" fill="#f3f4f6" font-size="12">id_instrutor</text>
    <text x="226" y="60" fill="#9ca3af" font-size="11" text-anchor="end">INT</text>

    <text x="42" y="84" fill="#e5e7eb" font-size="12">nome</text>
    <text x="226" y="84" fill="#9ca3af" font-size="11" text-anchor="end">VARCHAR(120)</text>

    <text x="14" y="108" fill="#38bdf8" font-size="11" font-weight="700">UK</text>
    <text x="42" y="108" fill="#e5e7eb" font-size="12">email</text>
    <text x="226" y="108" fill="#9ca3af" font-size="11" text-anchor="end">VARCHAR(150)</text>

    <text x="42" y="132" fill="#e5e7eb" font-size="12">especialidade</text>
    <text x="226" y="132" fill="#9ca3af" font-size="11" text-anchor="end">VARCHAR(100)</text>

    <text x="42" y="156" fill="#e5e7eb" font-size="12">criado_em</text>
    <text x="226" y="156" fill="#9ca3af" font-size="11" text-anchor="end">DATETIME</text>
  </g>

  <!-- ==================== TABELA 2: CURSOS ==================== -->
  <g transform="translate(360, 65)" filter="url(#shadow)">
    <rect width="240" height="220" rx="10" fill="#161f33" stroke="#334155" stroke-width="1.5" />
    <path d="M 0 10 Q 0 0 10 0 L 230 0 Q 240 0 240 10 L 240 36 L 0 36 Z" fill="url(#headerBlue)" />
    <text x="120" y="23" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">CURSOS</text>

    <text x="14" y="60" fill="#fbbf24" font-size="12" font-weight="700">PK</text>
    <text x="42" y="60" fill="#f3f4f6" font-size="12">id_curso</text>
    <text x="226" y="60" fill="#9ca3af" font-size="11" text-anchor="end">INT</text>

    <text x="14" y="84" fill="#a78bfa" font-size="12" font-weight="700">FK</text>
    <text x="42" y="84" fill="#f3f4f6" font-size="12">id_instrutor</text>
    <text x="226" y="84" fill="#9ca3af" font-size="11" text-anchor="end">INT</text>

    <text x="42" y="108" fill="#e5e7eb" font-size="12">titulo</text>
    <text x="226" y="108" fill="#9ca3af" font-size="11" text-anchor="end">VARCHAR(150)</text>

    <text x="42" y="132" fill="#e5e7eb" font-size="12">categoria</text>
    <text x="226" y="132" fill="#9ca3af" font-size="11" text-anchor="end">ENUM</text>

    <text x="42" y="156" fill="#e5e7eb" font-size="12">carga_horaria</text>
    <text x="226" y="156" fill="#9ca3af" font-size="11" text-anchor="end">INT</text>

    <text x="42" y="180" fill="#e5e7eb" font-size="12">valor</text>
    <text x="226" y="180" fill="#9ca3af" font-size="11" text-anchor="end">DECIMAL(10,2)</text>

    <text x="42" y="204" fill="#e5e7eb" font-size="12">total_matriculados</text>
    <text x="226" y="204" fill="#9ca3af" font-size="11" text-anchor="end">INT</text>
  </g>

  <!-- ==================== TABELA 3: MATRICULAS ==================== -->
  <g transform="translate(690, 65)" filter="url(#shadow)">
    <rect width="240" height="230" rx="10" fill="#161f33" stroke="#334155" stroke-width="1.5" />
    <path d="M 0 10 Q 0 0 10 0 L 230 0 Q 240 0 240 10 L 240 36 L 0 36 Z" fill="url(#headerPurple)" />
    <text x="120" y="23" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">MATRICULAS</text>

    <text x="14" y="60" fill="#fbbf24" font-size="12" font-weight="700">PK</text>
    <text x="42" y="60" fill="#f3f4f6" font-size="12">id_matricula</text>
    <text x="226" y="60" fill="#9ca3af" font-size="11" text-anchor="end">INT</text>

    <text x="14" y="84" fill="#a78bfa" font-size="12" font-weight="700">FK</text>
    <text x="42" y="84" fill="#f3f4f6" font-size="12">id_aluno</text>
    <text x="226" y="84" fill="#9ca3af" font-size="11" text-anchor="end">INT</text>

    <text x="14" y="108" fill="#a78bfa" font-size="12" font-weight="700">FK</text>
    <text x="42" y="108" fill="#f3f4f6" font-size="12">id_curso</text>
    <text x="226" y="108" fill="#9ca3af" font-size="11" text-anchor="end">INT</text>

    <text x="42" y="132" fill="#e5e7eb" font-size="12">progresso_percentual</text>
    <text x="226" y="132" fill="#9ca3af" font-size="11" text-anchor="end">DECIMAL(5,2)</text>

    <text x="42" y="156" fill="#e5e7eb" font-size="12">status_matricula</text>
    <text x="226" y="156" fill="#9ca3af" font-size="11" text-anchor="end">ENUM</text>

    <text x="42" y="180" fill="#e5e7eb" font-size="12">valor_pago</text>
    <text x="226" y="180" fill="#9ca3af" font-size="11" text-anchor="end">DECIMAL(10,2)</text>

    <text x="14" y="204" fill="#38bdf8" font-size="11" font-weight="700">UK</text>
    <text x="42" y="204" fill="#e5e7eb" font-size="12">codigo_certificado</text>
    <text x="226" y="204" fill="#9ca3af" font-size="11" text-anchor="end">VARCHAR(40)</text>
  </g>

  <!-- ==================== TABELA 4: ALUNOS ==================== -->
  <g transform="translate(360, 325)" filter="url(#shadow)">
    <rect width="240" height="175" rx="10" fill="#161f33" stroke="#334155" stroke-width="1.5" />
    <path d="M 0 10 Q 0 0 10 0 L 230 0 Q 240 0 240 10 L 240 36 L 0 36 Z" fill="url(#headerGreen)" />
    <text x="120" y="23" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">ALUNOS</text>

    <text x="14" y="60" fill="#fbbf24" font-size="12" font-weight="700">PK</text>
    <text x="42" y="60" fill="#f3f4f6" font-size="12">id_aluno</text>
    <text x="226" y="60" fill="#9ca3af" font-size="11" text-anchor="end">INT</text>

    <text x="42" y="84" fill="#e5e7eb" font-size="12">nome</text>
    <text x="226" y="84" fill="#9ca3af" font-size="11" text-anchor="end">VARCHAR(120)</text>

    <text x="14" y="108" fill="#38bdf8" font-size="11" font-weight="700">UK</text>
    <text x="42" y="108" fill="#e5e7eb" font-size="12">email</text>
    <text x="226" y="108" fill="#9ca3af" font-size="11" text-anchor="end">VARCHAR(150)</text>

    <text x="14" y="132" fill="#38bdf8" font-size="11" font-weight="700">UK</text>
    <text x="42" y="132" fill="#e5e7eb" font-size="12">cpf</text>
    <text x="226" y="132" fill="#9ca3af" font-size="11" text-anchor="end">CHAR(11)</text>

    <text x="42" y="156" fill="#e5e7eb" font-size="12">status_conta</text>
    <text x="226" y="156" fill="#9ca3af" font-size="11" text-anchor="end">ENUM</text>
  </g>

  <!-- ==================== TABELA 5: LOGS_AUDITORIA ==================== -->
  <g transform="translate(30, 325)" filter="url(#shadow)">
    <rect width="240" height="175" rx="10" fill="#161f33" stroke="#334155" stroke-width="1.5" />
    <path d="M 0 10 Q 0 0 10 0 L 230 0 Q 240 0 240 10 L 240 36 L 0 36 Z" fill="url(#headerAmber)" />
    <text x="120" y="23" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">LOGS_AUDITORIA (Trigger)</text>

    <text x="14" y="60" fill="#fbbf24" font-size="12" font-weight="700">PK</text>
    <text x="42" y="60" fill="#f3f4f6" font-size="12">id_log</text>
    <text x="226" y="60" fill="#9ca3af" font-size="11" text-anchor="end">INT</text>

    <text x="42" y="84" fill="#e5e7eb" font-size="12">tabela_afetada</text>
    <text x="226" y="84" fill="#9ca3af" font-size="11" text-anchor="end">VARCHAR(60)</text>

    <text x="42" y="108" fill="#e5e7eb" font-size="12">acao</text>
    <text x="226" y="108" fill="#9ca3af" font-size="11" text-anchor="end">VARCHAR(30)</text>

    <text x="42" y="132" fill="#e5e7eb" font-size="12">detalhes</text>
    <text x="226" y="132" fill="#9ca3af" font-size="11" text-anchor="end">VARCHAR(255)</text>

    <text x="42" y="156" fill="#e5e7eb" font-size="12">data_evento</text>
    <text x="226" y="156" fill="#9ca3af" font-size="11" text-anchor="end">DATETIME</text>
  </g>
</svg>
